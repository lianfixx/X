name: Control de la skill

# Corre en cada push y pull request, venga de la IA que venga: pruebas, SKILL.md y puentes,
# registro con «Agente:», secretos y borradores privados. Ver ia/REGLAS.md.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Control
        run: python3 ia/verificar.py ci
