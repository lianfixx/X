name: Vigilar el algoritmo de X

# Cada lunes compara el código vivo de xai-org/x-algorithm con skills/x-viral/data/pesos.json.
# Si algo cambió, el trabajo falla y GitHub avisa: toca actualizar la skill
# (SKILL.md, «Mantener al día»). No modifica nada por sí solo.
on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Clonar el código de X (solo lectura; no se ejecuta)
        run: git clone --depth 1 https://github.com/xai-org/x-algorithm "$RUNNER_TEMP/x-algorithm"
      - name: Comparar pesos y actualizaciones
        run: python3 skills/x-viral/scripts/xviral.py pesos comparar --repo "$RUNNER_TEMP/x-algorithm"
